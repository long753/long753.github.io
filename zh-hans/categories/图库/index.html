							<input type="radio" name="color-scheme" value="amethyst" class="peer sr-only" />
							<span
								class="text-muted-foreground hover:bg-muted hover:text-foreground peer-checked:bg-accent peer-checked:text-accent-foreground peer-focus-visible:ring-ring/50 flex h-8 w-full cursor-pointer items-center truncate rounded-md px-2 text-sm transition-colors peer-checked:font-medium peer-focus-visible:ring-2"
							>
								Amethyst
							</span>
						</label><label class="block min-w-0">
							<input type="radio" name="color-scheme" value="slate" class="peer sr-only" />
							<span
								class="text-muted-foreground hover:bg-muted hover:text-foreground peer-checked:bg-accent peer-checked:text-accent-foreground peer-focus-visible:ring-ring/50 flex h-8 w-full cursor-pointer items-center truncate rounded-md px-2 text-sm transition-colors peer-checked:font-medium peer-focus-visible:ring-2"
							>
								Slate
							</span>
						</label><label class="block min-w-0">
							<input type="radio" name="color-scheme" value="x" class="peer sr-only" />
							<span
								class="text-muted-foreground hover:bg-muted hover:text-foreground peer-checked:bg-accent peer-checked:text-accent-foreground peer-focus-visible:ring-ring/50 flex h-8 w-full cursor-pointer items-center truncate rounded-md px-2 text-sm transition-colors peer-checked:font-medium peer-focus-visible:ring-2"
							>
								X
							</span>
						</label><label class="block min-w-0">
							<input type="radio" name="color-scheme" value="minimal" class="peer sr-only" />
							<span
								class="text-muted-foreground hover:bg-muted hover:text-foreground peer-checked:bg-accent peer-checked:text-accent-foreground peer-focus-visible:ring-ring/50 flex h-8 w-full cursor-pointer items-center truncate rounded-md px-2 text-sm transition-colors peer-checked:font-medium peer-focus-visible:ring-2"
							>
								Minimal
							</span>
						</label></div>
			</fieldset><fieldset class="border-border border-t pt-3">
				<legend class="text-muted-foreground mb-1.5 px-1 text-xs font-medium">
					明暗模式
				</legend>
				<div class="bg-muted grid grid-cols-3 gap-0.5 rounded-md p-0.5"><label class="block">
							<input type="radio" name="theme-mode" value="light" class="peer sr-only" />
							<span
								class="text-muted-foreground hover:text-foreground peer-checked:bg-background peer-checked:text-foreground peer-focus-visible:ring-ring/50 flex h-7 w-full cursor-pointer items-center justify-center rounded-sm px-2 text-xs font-medium transition-colors peer-focus-visible:ring-2"
							>
								亮色
							</span>
						</label><label class="block">
							<input type="radio" name="theme-mode" value="dark" class="peer sr-only" />
							<span
								class="text-muted-foreground hover:text-foreground peer-checked:bg-background peer-checked:text-foreground peer-focus-visible:ring-ring/50 flex h-7 w-full cursor-pointer items-center justify-center rounded-sm px-2 text-xs font-medium transition-colors peer-focus-visible:ring-2"
							>
								暗色
							</span>
						</label><label class="block">
							<input type="radio" name="theme-mode" value="system" class="peer sr-only" />
							<span
								class="text-muted-foreground hover:text-foreground peer-checked:bg-background peer-checked:text-foreground peer-focus-visible:ring-ring/50 flex h-7 w-full cursor-pointer items-center justify-center rounded-sm px-2 text-xs font-medium transition-colors peer-focus-visible:ring-2"
							>
								跟随系统
							</span>
						</label></div>
			</fieldset><fieldset class="border-border space-y-2 border-t pt-3">
				<div class="flex items-center justify-between px-1">
					<legend class="text-muted-foreground text-xs font-medium">
						页面宽度
					</legend>
					<div class="flex items-center gap-2">
						<output
							id="content-width-value"
							for="content-width-range"
							class="text-muted-foreground font-mono text-xs tabular-nums"
						></output>
						<button
							id="content-width-reset"
							type="button"
							class="text-muted-foreground hover:text-foreground text-xs transition-colors"
						>
							恢复默认
						</button>
					</div>
				</div>
				<input
					id="content-width-range"
					class="w-full"
					type="range"
					min="40"
					max="90"
					step="1"
					aria-label="页面宽度"
				/>
			</fieldset><fieldset class="border-border space-y-2 border-t pt-3">
				<div class="flex items-center justify-between px-1">
					<legend class="text-muted-foreground text-xs font-medium">
						背景磨砂
					</legend>
					<div class="flex items-center gap-2">
						<output
							id="backdrop-blur-value"
							for="backdrop-blur-range"
							class="text-muted-foreground font-mono text-xs tabular-nums"
						></output>
						<button
							id="backdrop-blur-reset"
							type="button"
							class="text-muted-foreground hover:text-foreground text-xs transition-colors"
						>
							恢复默认
						</button>
					</div>
				</div>
				<input
					id="backdrop-blur-range"
					class="w-full"
					type="range"
					min="0"
					max="24"
					step="1"
					aria-label="背景磨砂"
				/>
			</fieldset><fieldset class="border-border space-y-2 border-t pt-3">
				<div class="flex items-center justify-between px-1">
					<legend class="text-muted-foreground text-xs font-medium">
						背景噪点
					</legend>
					<div class="flex items-center gap-2">
						<output
							id="grain-size-value"
							for="grain-size-range"
							class="text-muted-foreground font-mono text-xs tabular-nums"
						></output>
						<button
							id="grain-size-reset"
							type="button"
							class="text-muted-foreground hover:text-foreground text-xs transition-colors"
						>
							恢复默认
						</button>
					</div>
				</div>
				<input
					id="grain-size-range"
					class="w-full"
					type="range"
					min="0"
					max="100"
					step="5"
					aria-label="背景噪点"
				/>
			</fieldset><fieldset class="border-border border-t pt-3">
				<legend class="text-muted-foreground mb-1.5 px-1 text-xs font-medium">
					语言
				</legend>
				<button
	id="language-toggle"
	type="button"
	popovertarget="language-panel"
	aria-controls="language-panel"
	aria-expanded="false"
	class="border-border bg-background text-foreground hover:bg-muted flex h-8 w-full items-center justify-between gap-2 rounded-md border px-2 text-sm transition-colors"
>
	<span class="flex min-w-0 items-center gap-1.5">
		<svg class="h-4 w-4" aria-hidden="true" viewBox="0 0 24 24"><use href="/icons/sprite.9a62952ab5ac1ade60632ba011ab4bc40e0ad0290caa5ea5e2c16b440c9198f6.svg#icon-language"></use></svg>
		<span class="truncate">简体中文</span>
	</span>
	<svg class="h-3 w-3" aria-hidden="true" viewBox="0 0 24 24"><use href="/icons/sprite.9a62952ab5ac1ade60632ba011ab4bc40e0ad0290caa5ea5e2c16b440c9198f6.svg#icon-chevron-down"></use></svg>
</button>

<div
	id="language-panel"
	popover
	class="dock-popover text-popover-foreground border-border shadow-popover rounded-lg border p-1"
	aria-label="语言"
>
	<div class="grid grid-cols-1 gap-0.5"><a
				href="/"
				hreflang="en"
				lang="en"
				class="
				text-muted-foreground hover:bg-muted hover:text-foreground
 flex h-8 items-center truncate rounded-md px-2 text-sm transition-colors"
				
			>
				English
			</a><a
				href="/zh-hans/categories/%E5%9B%BE%E5%BA%93/"
				hreflang="zh-hans"
				lang="zh-hans"
				class="
				bg-accent text-accent-foreground font-medium
 flex h-8 items-center truncate rounded-md px-2 text-sm transition-colors"
				aria-current="true"
			>
				简体中文
			</a></div>
</div>

			</fieldset></div>


		<button
			id="dock-top"
			type="button"
			class="dock-item"
			title="返回顶部"
			aria-label="返回顶部"
			hidden
		>
			<svg class="h-4 w-4" aria-hidden="true" viewBox="0 0 24 24"><use href="/icons/sprite.9a62952ab5ac1ade60632ba011ab4bc40e0ad0290caa5ea5e2c16b440c9198f6.svg#icon-arrow-up"></use></svg>
		</button>
	</div>
</div>

		
		
			
<dialog
	id="search-modal"
	class="text-popover-foreground border-border shadow-popover m-auto max-h-[80dvh] w-11/12 max-w-xl overflow-hidden rounded-lg border p-0"
	aria-labelledby="search-title"
	tabindex="-1"
>
	
	<div class="border-border flex items-center gap-3 border-b p-3">
		
		<div class="text-muted-foreground h-5 w-5 shrink-0">
			<svg class="h-4 w-4" aria-hidden="true" viewBox="0 0 24 24"><use href="/icons/sprite.9a62952ab5ac1ade60632ba011ab4bc40e0ad0290caa5ea5e2c16b440c9198f6.svg#icon-search"></use></svg>
		</div>
		<h2 id="search-title" class="sr-only">搜索</h2>

		
		<div class="relative flex-1">
			
			<button
				id="search-clear"
				type="button"
				class="text-muted-foreground hover:text-foreground hover:bg-muted/50 pointer-events-none absolute top-1/2 left-0 z-10 h-5 w-5 -translate-y-1/2 rounded opacity-0 transition-all duration-200"
				title="清空"
				aria-label="清空"
			>
				<svg class="h-4 w-4" aria-hidden="true" viewBox="0 0 24 24"><use href="/icons/sprite.9a62952ab5ac1ade60632ba011ab4bc40e0ad0290caa5ea5e2c16b440c9198f6.svg#icon-close"></use></svg>
			</button>

			
			<input
				id="search-input"
				type="text"
				role="combobox"
				aria-autocomplete="list"
				aria-controls="search-items"
				aria-expanded="false"
				aria-labelledby="search-title"
				placeholder="搜索文章..."
				class="text-foreground placeholder:text-muted-foreground w-full border-none bg-transparent pl-8 text-base outline-none"
				autocomplete="off"
				autocapitalize="off"
				spellcheck="false"
				autofocus
			/>
		</div>

		
		<button
			id="search-close"
			type="button"
			class="text-muted-foreground hover:bg-muted hover:text-foreground inline-flex size-7 items-center justify-center rounded-md transition-colors"
			title="关闭"
			aria-label="关闭"
		>
			<svg class="h-4 w-4" aria-hidden="true" viewBox="0 0 24 24"><use href="/icons/sprite.9a62952ab5ac1ade60632ba011ab4bc40e0ad0290caa5ea5e2c16b440c9198f6.svg#icon-close"></use></svg>
		</button>
	</div>

	
	<div id="search-results" class="max-h-96 overflow-y-auto">
		
		<div id="search-empty" class="text-muted-foreground px-4 py-10 text-center text-sm">
			开始搜索
		</div>

		
		<div id="search-loading" class="flex items-center justify-center py-8" hidden>
			<div
				class="mr-3 h-6 w-6 animate-spin rounded-full border-2 border-current border-t-transparent"
			></div>
			<span class="text-muted-foreground">搜索中...</span>
		</div>

		
		<div id="search-no-results" class="text-muted-foreground px-4 py-10 text-center text-sm" hidden>
			未找到结果
		</div>

		
		<div id="search-results-list" hidden>
			
			<div
				id="search-stats"
				class="text-muted-foreground border-border border-b px-3 py-2 text-xs"
				data-count-other="找到 %d 个结果"
				role="status"
				aria-live="polite"
			></div>

			
			<ul id="search-items" class="divide-border divide-y" role="listbox">
				
			</ul>
		</div>
	</div>

	
	<div class="border-border bg-muted/30 border-t px-3 py-2"><div class="text-muted-foreground flex items-center justify-between text-xs">
			<div class="flex items-center gap-2 md:gap-4">
				<div class="flex items-center gap-1">
					<kbd class="bg-muted border-border rounded border px-1.5 py-0.5 text-xs">↑↓</kbd>
					<span class="hidden sm:inline">导航</span>
				</div>
				<div class="flex items-center gap-1">
					<kbd class="bg-muted border-border rounded border px-1.5 py-0.5 text-xs">↵</kbd>
					<span class="hidden sm:inline">选择</span>
				</div>
				<div class="flex items-center gap-1">
					<kbd class="bg-muted border-border rounded border px-1.5 py-0.5 text-xs">ESC</kbd>
					<span class="hidden sm:inline">关闭</span>
				</div>
			</div>
			<div class="search-hint-desktop flex items-center gap-1">
				<kbd
					id="search-shortcut"
					class="bg-muted border-border rounded border px-1.5 py-0.5 text-xs"
				>Ctrl K</kbd
				>
				<span>快捷键</span>
			</div>
		</div>
	</div>
</dialog>
